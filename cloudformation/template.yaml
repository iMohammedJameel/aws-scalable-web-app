AWSTemplateFormatVersion: "2010-09-09"
Description: >
  SAA-C03 Graduation Project 1 — Scalable Web Application with ALB and Auto Scaling.
  Production-grade multi-AZ architecture: VPC with public/private subnets across 2 AZs,
  NAT Gateway per AZ, internet-facing ALB, EC2 Auto Scaling (target tracking),
  Multi-AZ RDS MySQL 8.0, S3 static assets, CloudFront CDN with AWS WAF,
  CloudWatch alarms + SNS, SSM Session Manager access.
  Deploy in us-east-1 (WAF-for-CloudFront requires us-east-1).

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "General" }
        Parameters: [EnvironmentName, AlarmEmail]
      - Label: { default: "Network (VPC)" }
        Parameters: [VpcCidr, PublicSubnet1Cidr, PublicSubnet2Cidr, PrivateAppSubnet1Cidr, PrivateAppSubnet2Cidr, PrivateDataSubnet1Cidr, PrivateDataSubnet2Cidr]
      - Label: { default: "Compute (EC2 / ASG)" }
        Parameters: [LatestAmiId, InstanceType, MinSize, MaxSize, DesiredCapacity, TargetCpuUtilization]
      - Label: { default: "Database (RDS MySQL)" }
        Parameters: [RdsInstanceClass, RdsMasterUsername, RdsMasterUserPassword, RdsStorageType, RdsAllocatedStorage, RdsBackupRetentionDays, RdsDeletionProtection]
      - Label: { default: "Edge (CloudFront / WAF / DNS)" }
        Parameters: [EnableWaf, AlbCertificateArn, DomainName]

Parameters:
  EnvironmentName:
    Type: String
    Default: prod
    Description: Environment name used as a prefix for resources (e.g. prod, dev).

  AlarmEmail:
    Type: String
    Description: Email address that receives CloudWatch alarm notifications via SNS.
    AllowedPattern: "^[\\w.+-]+@[\\w-]+\\.[\\w.-]+$"

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'

  PublicSubnet1Cidr:
    Type: String
    Default: 10.0.1.0/24
  PublicSubnet2Cidr:
    Type: String
    Default: 10.0.2.0/24
  PrivateAppSubnet1Cidr:
    Type: String
    Default: 10.0.11.0/24
  PrivateAppSubnet2Cidr:
    Type: String
    Default: 10.0.12.0/24
  PrivateDataSubnet1Cidr:
    Type: String
    Default: 10.0.21.0/24
  PrivateDataSubnet2Cidr:
    Type: String
    Default: 10.0.22.0/24

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: SSM parameter pointing to the latest Amazon Linux 2023 AMI.

  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.small, t3.medium, t3.large, t3.xlarge, t4g.medium, t4g.large, m5.large, m5.xlarge]

  MinSize:
    Type: Number
    Default: 2
    MinValue: 2
    Description: Minimum fleet size (>= 2 keeps one instance per AZ).
  MaxSize:
    Type: Number
    Default: 6
  DesiredCapacity:
    Type: Number
    Default: 2
  TargetCpuUtilization:
    Type: Number
    Default: 40
    MinValue: 20
    MaxValue: 80
    Description: Target-tracking CPU utilization percentage for the ASG.

  RdsInstanceClass:
    Type: String
    Default: db.t3.medium
    AllowedValues: [db.t3.small, db.t3.medium, db.t3.large, db.m5.large, db.m5.xlarge]
  RdsMasterUsername:
    Type: String
    Default: dbadmin
    MinLength: 4
    MaxLength: 16
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9]*$"
  RdsMasterUserPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 41
    Description: RDS master password (8-41 chars). Passed to instances via SSM Parameter Store (SecureString).
  RdsStorageType:
    Type: String
    Default: gp3
    AllowedValues: [gp2, gp3]
  RdsAllocatedStorage:
    Type: Number
    Default: 50
    MinValue: 20
    MaxValue: 1000
  RdsBackupRetentionDays:
    Type: Number
    Default: 35
    MinValue: 1
    MaxValue: 35
  RdsDeletionProtection:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set to "false" before deleting the stack (otherwise RDS deletion is blocked).

  EnableWaf:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Attach an AWS WAF WebACL (OWASP managed rules + rate limit) to CloudFront.

  AlbCertificateArn:
    Type: String
    Default: ""
    Description: >
      Optional ACM certificate ARN (must exist in the DEPLOY region) for the ALB HTTPS
      listener. If empty, the ALB serves plain HTTP and CloudFront reaches it over HTTP
      (zero-prerequisite test mode). Provide a DNS-validated ACM cert for production HTTPS.

  DomainName:
    Type: String
    Default: ""
    Description: >
      Optional custom domain (e.g. app.example.com). If provided, a Route 53 hosted zone
      and alias records to CloudFront are created. Note: a custom HTTPS certificate on
      CloudFront must be requested in us-east-1 and attached manually (ACM DNS validation).

Conditions:
  HasWaf: !Equals [!Ref EnableWaf, "true"]
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]
  HasAlbCert: !Not [!Equals [!Ref AlbCertificateArn, ""]]

Resources:
  # ══════════════════════════════════════════════════════════════════════
  # NETWORK — VPC, subnets, IGW, NAT Gateways, routing
  # ══════════════════════════════════════════════════════════════════════

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-igw"

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  # ── Public subnets (ALB nodes + NAT Gateways) ──
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref PublicSubnet1Cidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-public-az1"

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Ref PublicSubnet2Cidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-public-az2"

  # ── Private app subnets (EC2 fleet) ──
  PrivateAppSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref PrivateAppSubnet1Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-app-az1"

  PrivateAppSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Ref PrivateAppSubnet2Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-app-az2"

  # ── Private data subnets (RDS) ──
  PrivateDataSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref PrivateDataSubnet1Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-data-az1"

  PrivateDataSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Ref PrivateDataSubnet2Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-data-az2"

  # ── NAT Gateways (one per AZ — HA + no cross-AZ charges) ──
  NatGateway1EIP:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc

  NatGateway2EIP:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc

  NatGateway1:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGateway1EIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-nat-az1"

  NatGateway2:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGateway2EIP.AllocationId
      SubnetId: !Ref PublicSubnet2
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-nat-az2"

  # ── Route tables ──
  PublicRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-public-rt-az1"

  PublicRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-public-rt-az2"

  DefaultPublicRoute1:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable1
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  DefaultPublicRoute2:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable2
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable1
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable2
      SubnetId: !Ref PublicSubnet2

  PrivateAppRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-app-rt-az1"

  PrivateAppRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-app-rt-az2"

  PrivateAppRoute1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateAppRouteTable1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway1

  PrivateAppRoute2:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateAppRouteTable2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway2

  PrivateAppSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateAppRouteTable1
      SubnetId: !Ref PrivateAppSubnet1

  PrivateAppSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateAppRouteTable2
      SubnetId: !Ref PrivateAppSubnet2

  # Data-tier NACL: deny everything EXCEPT intra-VPC traffic + DNS.
  # This blocks any internet egress from the database tier while keeping
  # RDS Multi-AZ replication (TCP 3306 between data subnets) fully functional.
  DataSubnetNetworkAcl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-data-nacl"

  DataNaclInboundTcp:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref DataSubnetNetworkAcl
      RuleNumber: 100
      Protocol: "6"          # TCP (app→DB :3306, replication, ephemeral responses)
      RuleAction: allow
      Egress: false
      PortRange: { From: 0, To: 65535 }
      CidrBlock: !Ref VpcCidr

  DataNaclInboundDns:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref DataSubnetNetworkAcl
      RuleNumber: 110
      Protocol: "17"         # UDP DNS to the VPC resolver (.2 address)
      RuleAction: allow
      Egress: false
      PortRange: { From: 53, To: 53 }
      CidrBlock: !Ref VpcCidr

  DataNaclOutboundTcp:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref DataSubnetNetworkAcl
      RuleNumber: 100
      Protocol: "6"
      RuleAction: allow
      Egress: true
      PortRange: { From: 0, To: 65535 }
      CidrBlock: !Ref VpcCidr

  DataNaclOutboundDns:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref DataSubnetNetworkAcl
      RuleNumber: 110
      Protocol: "17"
      RuleAction: allow
      Egress: true
      PortRange: { From: 53, To: 53 }
      CidrBlock: !Ref VpcCidr

  DataSubnet1AclAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref PrivateDataSubnet1
      NetworkAclId: !Ref DataSubnetNetworkAcl

  DataSubnet2AclAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref PrivateDataSubnet2
      NetworkAclId: !Ref DataSubnetNetworkAcl

  # ══════════════════════════════════════════════════════════════════════
  # SECURITY GROUPS — SG-referencing (least privilege)
  # ══════════════════════════════════════════════════════════════════════

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB — accepts HTTP/HTTPS from the internet
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-alb-sg"

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EC2 app tier — accepts app traffic from the ALB only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !GetAtt AlbSecurityGroup.GroupId
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-app-sg"

  # Port 22 intentionally NOT opened — access is via SSM Session Manager only.
  AppSecurityGroupIngressSelf:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt AppSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 0
      ToPort: 65535
      SourceSecurityGroupId: !GetAtt AppSecurityGroup.GroupId

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS — accepts MySQL only from the app tier SG
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !GetAtt AppSecurityGroup.GroupId
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-db-sg"

  # ══════════════════════════════════════════════════════════════════════
  # IAM — least-privilege instance role (SSM + CloudWatch + S3 read)
  # ══════════════════════════════════════════════════════════════════════

  AppInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-app-instance-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: app-tier-inline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadAssetsBucket
                Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource:
                  - !GetAtt AssetsBucket.Arn
                  - !Sub "${AssetsBucket.Arn}/*"
              - Sid: ReadDbSecretParam
                Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters]
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${EnvironmentName}/db-password"

  AppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref AppInstanceRole]

  # DB password passed to instances via SSM Parameter Store (SecureString),
  # so it never appears in user-data or instance metadata.
  DbPasswordParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${EnvironmentName}/db-password"
      Type: String
      Value: !Ref RdsMasterUserPassword
      Description: RDS master password for the app tier (rotate manually for production use).

  # ══════════════════════════════════════════════════════════════════════
  # COMPUTE — ALB, Target Group, Launch Template, Auto Scaling
  # ══════════════════════════════════════════════════════════════════════

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${EnvironmentName}-web-tg"
      VpcId: !Ref VPC
      Port: 8080
      Protocol: HTTP
      TargetType: instance
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      DeregistrationDelay: 30
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-web-tg"

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${EnvironmentName}-web-alb"
      Scheme: internet-facing
      Type: application
      Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
      SecurityGroups: [!GetAtt AlbSecurityGroup.GroupId]
      Attributes:
        - Key: deletion_protection.enabled
          Value: "false"

  AlbHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      # With a certificate: HTTP is bounced to HTTPS. Without one (test mode)
      # HTTP serves directly so the stack works with zero prerequisites.
      DefaultActions: !If
        - HasAlbCert
        - - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: "443"
              StatusCode: HTTP_301
        - - Type: forward
            TargetGroupArn: !Ref WebTargetGroup

  AlbHttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasAlbCert
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref AlbCertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

  WebServerLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${EnvironmentName}-web-lt"
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt AppInstanceProfile.Arn
        MetadataOptions:
          HttpTokens: required          # IMDSv2 only
          HttpPutResponseHopLimit: 1
        SecurityGroupIds: [!GetAtt AppSecurityGroup.GroupId]
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 20
              VolumeType: gp3
              Encrypted: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub "${EnvironmentName}-web-server"
              - Key: Environment
                Value: !Ref EnvironmentName
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            dnf install -y nginx
            systemctl enable --now nginx
            # Health endpoint for the ALB target group
            mkdir -p /usr/share/nginx/html
            cat > /usr/share/nginx/html/health <<'EOF'
            {"status":"ok"}
            EOF
            # Simple dynamic landing page proving the stack works end-to-end
            cat > /usr/share/nginx/html/index.html <<EOF
            <html><head><title>SAA-C03 Project 1</title></head>
            <body style="font-family:sans-serif;text-align:center;padding-top:60px">
            <h1>Scalable Web App &mdash; it works!</h1>
            <p>Instance: $(hostname -f)</p>
            <p>App tier served via ALB + Auto Scaling</p>
            </body></html>
            EOF
            # Serve on 8080 (app-tier port allowed by the App Security Group)
            cat > /etc/nginx/default.d/8080.conf <<'EOF'
            server {
              listen 8080;
              location / { root /usr/share/nginx/html; index index.html; }
              location = /health { return 200 '{"status":"ok"}'; add_header Content-Type application/json; }
            }
            EOF
            systemctl restart nginx

  WebServerAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub "${EnvironmentName}-web-asg"
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize
      DesiredCapacity: !Ref DesiredCapacity
      VPCZoneIdentifier: [!Ref PrivateAppSubnet1, !Ref PrivateAppSubnet2]
      TargetGroupARNs: [!Ref WebTargetGroup]
      LaunchTemplate:
        LaunchTemplateId: !Ref WebServerLaunchTemplate
        Version: !GetAtt WebServerLaunchTemplate.LatestVersionNumber
      HealthCheckType: ELB
      HealthCheckGracePeriod: 120
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-web-server"
          PropagateAtLaunch: true
        - Key: Environment
          Value: !Ref EnvironmentName
          PropagateAtLaunch: true
    UpdatePolicy:
      AutoScalingRollingUpdate:
        WaitOnResourceSignals: false
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT3M
      AutoScalingScheduledAction:
        IgnoreUnmodifiedGroupSizeProperties: true

  WebServerScaleOutPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref WebServerAutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: !Ref TargetCpuUtilization

  # ══════════════════════════════════════════════════════════════════════
  # DATA — RDS MySQL 8.0 Multi-AZ
  # ══════════════════════════════════════════════════════════════════════

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub "${EnvironmentName}-db-subnets"
      DBSubnetGroupDescription: Subnets for the Multi-AZ RDS deployment
      SubnetIds: [!Ref PrivateDataSubnet1, !Ref PrivateDataSubnet2]

  DbParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Family: mysql8.0
      Description: MySQL 8.0 parameters — utf8mb4 everywhere
      Parameters:
        character_set_server: utf8mb4
        collation_server: utf8mb4_general_ci
        time_zone: "+00:00"

  AppDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "${EnvironmentName}-app-db"
      DBInstanceClass: !Ref RdsInstanceClass
      Engine: mysql
      DBParameterGroupName: !Ref DbParameterGroup
      DBSubnetGroupName: !Ref DbSubnetGroup
      MultiAZ: true
      StorageType: !Ref RdsStorageType
      AllocatedStorage: !Ref RdsAllocatedStorage
      MaxAllocatedStorage: !Ref RdsAllocatedStorage
      StorageEncrypted: true
      MasterUsername: !Ref RdsMasterUsername
      MasterUserPassword: !Ref RdsMasterUserPassword
      BackupRetentionPeriod: !Ref RdsBackupRetentionDays
      PreferredBackupWindow: "03:00-04:00"
      PreferredMaintenanceWindow: "sun:04:30-sun:05:30"
      DeletionProtection: !Equals [!Ref RdsDeletionProtection, "true"]
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: true
      VPCSecurityGroups: [!GetAtt DatabaseSecurityGroup.GroupId]
      EnableCloudwatchLogsExports: [error, general, slowquery]
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-app-db"

  # ══════════════════════════════════════════════════════════════════════
  # STORAGE — S3 static assets (CloudFront origin, private via OAC)
  # ══════════════════════════════════════════════════════════════════════

  AssetsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${EnvironmentName}-static-assets-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  AssetsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AssetsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOACRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${AssetsBucket.Arn}/static/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt AssetsBucket.Arn
              - !Sub "${AssetsBucket.Arn}/*"
            Condition:
              Bool: { "aws:SecureTransport": false }

  # Origin Access Control — the modern (OAI-replacement) way to keep the bucket private
  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${EnvironmentName}-assets-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ══════════════════════════════════════════════════════════════════════
  # EDGE — WAF + CloudFront + Route 53
  # ══════════════════════════════════════════════════════════════════════

  # NOTE: a WebACL attached to CloudFront MUST be created in us-east-1.
  WafWebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: HasWaf
    Properties:
      Name: !Sub "${EnvironmentName}-edge-waf"
      Scope: CLOUDFRONT
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${EnvironmentName}-edge-waf"
        SampledRequestsEnabled: true
      Rules:
        - Name: AWSManagedCommonRuleSet
          Priority: 10
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              # ExcludedRules only if a rule false-positives on your app
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${EnvironmentName}-waf-common"
            SampledRequestsEnabled: true
        - Name: AWSManagedKnownBadInputs
          Priority: 20
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${EnvironmentName}-waf-badinputs"
            SampledRequestsEnabled: true
        - Name: RateLimitPerIP
          Priority: 30
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              Limit: 2000
              AggregateKeyType: IP
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${EnvironmentName}-waf-ratelimit"
            SampledRequestsEnabled: true

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: [ApplicationLoadBalancer]
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${EnvironmentName} — static (S3) + dynamic (ALB) behaviors"
        PriceClass: PriceClass_100
        HttpVersion: http2
        IPV6Enabled: true
        Aliases: !If [HasDomain, [!Ref DomainName], !Ref "AWS::NoValue"]
        WebACLId: !If [HasWaf, !GetAtt WafWebAcl.Arn, !Ref "AWS::NoValue"]
        Origins:
          - Id: alb-origin
            DomainName: !GetAtt ApplicationLoadBalancer.DNSName
            CustomOriginConfig:
              # https-only when an ALB certificate is supplied;
              # http-only in zero-prerequisite test mode.
              OriginProtocolPolicy: !If [HasAlbCert, https-only, http-only]
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 30
              OriginReadKeepaliveTimeout: 5
          - Id: s3-assets-origin
            DomainName: !GetAtt AssetsBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
        CacheBehaviors:
          - PathPattern: "static/*"
            TargetOriginId: s3-assets-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
        DefaultCacheBehavior:
          TargetOriginId: alb-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-a710-63a3f4d92bd0   # Managed-CachingDisabled
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e299670  # Managed-AllViewerExceptHostHeader
        CustomErrorResponses:
          - ErrorCode: 502
            ErrorCachingMinTTL: 10
          - ErrorCode: 503
            ErrorCachingMinTTL: 10
        Restrictions:
          GeoRestriction: { RestrictionType: none }

  # ── Optional Route 53 hosted zone + alias to CloudFront ──
  AppHostedZone:
    Type: AWS::Route53::HostedZone
    Condition: HasDomain
    Properties:
      Name: !Ref DomainName
      HostedZoneConfig:
        Comment: !Sub "${EnvironmentName} public zone"

  AppAliasRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref AppHostedZone
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2   # CloudFront's fixed alias hosted-zone id
        EvaluateTargetHealth: true

  AppAliasRecordAAAA:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref AppHostedZone
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: true

  # ══════════════════════════════════════════════════════════════════════
  # OBSERVABILITY — SNS + CloudWatch alarms
  # ══════════════════════════════════════════════════════════════════════

  AlarmNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${EnvironmentName}-alerts"
      DisplayName: !Sub "${EnvironmentName} alerts"

  AlarmNotificationSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmNotificationTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  AlbUnhealthyHostsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-alb-unhealthy-hosts"
      AlarmDescription: ALB reports unhealthy targets — app tier may be down
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt ApplicationLoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt WebTargetGroup.TargetGroupFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmNotificationTopic]
      OKActions: [!Ref AlarmNotificationTopic]

  Alb5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-alb-5xx"
      AlarmDescription: Elevated 5xx rate from the ALB
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt ApplicationLoadBalancer.LoadBalancerFullName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 25
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmNotificationTopic]
      OKActions: [!Ref AlarmNotificationTopic]

  RdsCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-rds-cpu-high"
      AlarmDescription: RDS CPU sustained above 80%
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref AppDatabase
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlarmNotificationTopic]
      OKActions: [!Ref AlarmNotificationTopic]

  RdsConnectionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-rds-connections-high"
      AlarmDescription: RDS approaching connection saturation
      Namespace: AWS/RDS
      MetricName: DatabaseConnections
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref AppDatabase
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlarmNotificationTopic]

  # ══════════════════════════════════════════════════════════════════════
  # OUTPUTS
  # ══════════════════════════════════════════════════════════════════════

Outputs:
  StackName:
    Description: CloudFormation stack name
    Value: !Ref AWS::StackName

  CloudFrontDomain:
    Description: Primary entry point — CloudFront distribution domain
    Value: !GetAtt CloudFrontDistribution.DomainName

  AlbDnsName:
    Description: Application Load Balancer DNS name (direct origin access)
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  AssetsBucketName:
    Description: S3 bucket holding static assets (upload to /static/*)
    Value: !Ref AssetsBucket

  RdsEndpoint:
    Description: RDS MySQL endpoint (Multi-AZ — same endpoint after failover)
    Value: !GetAtt AppDatabase.Endpoint.Address

  RdsPort:
    Description: RDS MySQL port
    Value: !GetAtt AppDatabase.Endpoint.Port

  AutoScalingGroupName:
    Description: Name of the web-tier Auto Scaling group
    Value: !Ref WebServerAutoScalingGroup
    Export:
      Name: !Sub "${AWS::StackName}-AsgName"

  LoadBalancerConsoleUrl:
    Description: Console URL for the ALB target group health view
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/ec2/home#LoadBalancers"

  DeploymentNote:
    Description: Reminder
    Value: "Upload assets with: aws s3 cp ./dist s3://<bucket>/static --recursive"
